name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: >-
          python -m unittest
          tests.test_loyverse.LoyverseTests.test_canonical_money_serializes_finite_values_exactly
          tests.test_loyverse.LoyverseTests.test_canonical_money_preserves_unknown_amount
          tests.test_loyverse.LoyverseTests.test_canonical_money_requires_valid_merchant_currency
          -v
      - run: python -m unittest discover -s tests -v
