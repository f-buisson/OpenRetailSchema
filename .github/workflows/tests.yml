name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: >-
          python -m unittest
          tests.test_loyverse.LoyverseTests.test_canonical_product_is_schema_valid_and_deterministic
          tests.test_loyverse.LoyverseTests.test_canonical_product_keeps_missing_price_distinct_from_zero
          tests.test_loyverse.LoyverseTests.test_canonical_product_rejects_invalid_required_fields
          tests.test_loyverse.LoyverseTests.test_canonical_product_rejects_malformed_optional_fields
          -v
      - run: python -m unittest discover -s tests -v
